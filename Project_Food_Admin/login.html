<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý nhà hàng</title>
    <link rel="stylesheet" href="./css/share.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .login-box {
            background: white; border-radius: 20px; padding: 40px; width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .login-box h1 {
            text-align: center; color: #333; margin-bottom: 8px; font-size: 24px;
        }
        .login-box p {
            text-align: center; color: #888; margin-bottom: 32px; font-size: 14px;
        }
        .login-box .logo {
            text-align: center; margin-bottom: 24px;
        }
        .login-box .logo img { width: 80px; border-radius: 50%; }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block; margin-bottom: 6px; font-weight: 600; color: #555; font-size: 14px;
        }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px;
            font-size: 15px; outline: none; transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #aaa;
        }
        .form-group .input-icon input {
            padding-left: 42px;
        }
        .btn-login {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: 0.3s; margin-top: 8px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            color: #d32f2f; font-size: 13px; text-align: center; margin-top: 12px; display: none;
        }
        .loading { display: none; text-align: center; margin-top: 12px; }
        .loading i { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">
            <img src="./imgs/logo/logo.png" alt="Logo">
        </div>
        <h1>Quản lý nhà hàng</h1>
        <p>Đăng nhập để quản trị hệ thống</p>

        <div class="form-group">
            <label>Tên đăng nhập</label>
            <div class="input-icon">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Nhập tài khoản..." autofocus>
            </div>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <div class="input-icon">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
            </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="doLogin()">
            <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
        </button>

        <div class="error-msg" id="errorMsg"></div>
        <div class="loading" id="loading"><i class="fa-solid fa-spinner"></i> Đang đăng nhập...</div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/apiClient.js"></script>
    <script>

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');

            if (!username || !password) {
                showError('Vui lòng nhập đầy đủ thông tin');
                return;
            }

            btn.disabled = true;
            loading.style.display = 'block';
            error.style.display = 'none';

            try {
                const res = await apiFetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    if (data.user.VaiTro !== 'Quản lý') {
                        showError('Chỉ tài khoản Quản lý mới được phép truy cập');
                        return;
                    }
                    localStorage.setItem('admin_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    showError(data.message || 'Sai tài khoản hoặc mật khẩu');
                }
            } catch (e) {
                if (!e.isConnectionError) {
                    showError('Không thể kết nối đến server');
                }
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('admin_user');
            if (saved) window.location.href = 'index.html';

            document.getElementById('password').addEventListener('keydown', e => {
                if (e.key === 'Enter') doLogin();
            });
        });
    </script>
</body>
</html>
